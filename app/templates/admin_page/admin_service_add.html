<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

<a href="" data-bs-toggle="modal" data-bs-target="#addNewServiceModal" class="btn px-3 fs-5 btn-lg" style="color: red;background-color: yellow;"><b>Add new Services</b></a>
  
  <!-- Modal -->
  <div class="modal fade" id="addNewServiceModal" tabindex="-1" aria-labelledby="addNewServiceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        
      <div class="modal-content">
        <div class="modal-header bg-info">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Add Services</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Service name</label>
                <input type="text" class="form-control text-white" id="exampleFormControlInput1" placeholder="Enter Service name" name="service_name" value="{{i.name}}">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Service Price</label>
                <input type="text" class="form-control text-white" id="exampleFormControlInput1" placeholder="Enter Service Price" name="price" value="{{i.price}}">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Service image</label>
                <input type="file" class="form-control text-white" id="exampleFormControlInput1" placeholder="Service image" name="image" value="{{i.image}}" accept="image/*">
              </div>
        </div>
        <div class="modal-footer bg-info">
          <button type="button" class="btn bg-danger text-white" data-bs-dismiss="modal">Close</button>
          <button name="save" value="{{i.id}}" class="btn btn-primary">Submit</button>
        
        </div>
      </div>
    </div>
  
  </div>











</form>
